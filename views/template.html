<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Server</title>
    <style>
        :root {
            --primary-color: #2a2a2a;
            --hover-color: #404040;
            --background-color: #121212;
            --text-color: #ffffff;
            --card-bg: #202020;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            background-color: var(--background-color);
            color: var(--text-color);
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            color: #888;
        }

        .breadcrumb a {
            color: var(--text-color);
            text-decoration: none;
            padding: 0.5rem;
        }

        .breadcrumb span {
            color: #888;
            margin: 0 0.5rem;
        }

        .file-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .file-item {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .file-item:hover {
            transform: translateY(-5px);
        }

        .file-link {
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            flex-direction: column;
        }

        .file-cover {
            width: 100%;
            aspect-ratio: 1;
            background-image: url('https://avatars.githubusercontent.com/u/127679210?v=4');
            background-size: cover;
            background-position: center;
        }

        .file-info {
            padding: 1rem;
        }

        .file-name {
            font-weight: 500;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .download-btn {
            background-color: var(--primary-color);
            color: var(--text-color);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
            width: 100%;
            margin-top: 0.5rem;
        }

        .download-btn:hover {
            background-color: var(--hover-color);
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .file-list {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="breadcrumb">
            <!-- Breadcrumb will be dynamically inserted here -->
        </nav>
        <ul class="file-list">
            <!-- File list will be dynamically inserted here -->
        </ul>
    </div>
    <script>
        function createBreadcrumb(path) {
            const parts = path.split('/').filter(part => part);
            const breadcrumb = document.querySelector('.breadcrumb');
            breadcrumb.innerHTML = '<a href="/">Home</a>';
            
            let currentPath = '';
            parts.forEach((part, index) => {
                currentPath += '/' + part;
                breadcrumb.innerHTML += `<span>/</span><a href="${currentPath}">${part}</a>`;
            });
        }

        function handleDownload(e, path) {
            e.preventDefault();
            window.location.href = '/download-folder?path=' + encodeURIComponent(path);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            createBreadcrumb(currentPath);
        });
    </script>
</body>
</html>
